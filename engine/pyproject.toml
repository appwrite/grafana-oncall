[tool.ruff]
line-length = 120
target-version = "py313"
extend-exclude = ["migrations"]

[tool.ruff.lint]
# The flake8 setup this replaces: pycodestyle/pyflakes defaults plus flake8-bugbear (B) and
# flake8-tidy-imports (TID), with isort (I) folded in.
select = ["E", "F", "W", "B", "I", "TID"]
# Never enforced here before ruff; ~200 pre-existing sites. Lift when someone sweeps them.
ignore = ["B904", "B905"]

[tool.ruff.lint.pycodestyle]
# The formatter wraps at 120; a line only it cannot split is tolerated up to here.
max-line-length = 180

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"jinja2.Template".msg = "Use apply_jinja_template instead"
"django.apps.apps".msg = "Import models directly instead"

[tool.mypy]
mypy_path = "$MYPY_CONFIG_FILE_DIR/type_stubs"
implicit_reexport = true
plugins = [
    "mypy_django_plugin.main",
    "mypy_drf_plugin.main",
]
exclude = [
    # TOML's double-quoted strings require escaping backslashes
    "tests/test_.*\\.py$",    # test files
    "migrations/\\d*.*\\.py",  # migration files
]
disable_error_code = [
    "abstract",
    "annotation-unchecked",
    "arg-type",
    "assignment",
    "attr-defined",
    "call-arg",
    "call-overload",
    "has-type",
    "index",
    "misc",
    "name-defined",
    "operator",
    "return-value",
    "typeddict-item",
    "union-attr",
]

# mypy per-module options
[[tool.mypy.overrides]]
module = [
    # the following setting should eventually be removed, one module at a time.
    # It's only being added to temporarily surpress the:
    # "module is installed, but missing library stubs or py.typed marker" errors
    # we can slowly either start to add library stubs ourselves, or try and upgrade these libraries to see if
    # a newer version includes type stubs
    "anymail.*",
    "celery.utils.debug",
    "debug_toolbar.*",
    "django_deprecate_fields.*",
    "django_migration_linter",
    "django_sns_view.*",
    "factory.*",
    "fcm_django.*",
    "firebase_admin.*",
    "google.auth.exceptions.*",
    "googleapiclient.discovery.*",
    "googleapiclient.errors.*",
    "google.oauth2.credentials.*",
    "humanize.*",
    "ipware.*",
    "markdown2.*",
    "mirage.*",
    "ordered_model.*",
    "phonenumbers.*",
    "polymorphic.*",
    "pyroscope.*",
    "ratelimit.*",
    "regex.*",
    "recurring_ical_events.*",
    "responses.*",
    "rest_polymorphic.*",
    "slackclient.*",
    "slackviewer.*",
    "social_core.*",
    "social_django.*",
    "twilio.*",
    "uwsgidecorators.*",
    "whitenoise.*",
    "uwsgi.*",
]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "settings.dev"
