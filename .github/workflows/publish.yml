name: Publish engine Docker image

on:
  push:
    tags:
      - v*

env:
  IMAGE: ghcr.io/appwrite/grafana-oncall

jobs:
  build:
    name: Build ${{ matrix.arch }}
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set engine version number in settings file
        uses: ./.github/actions/set-engine-version-in-settings
        with:
          working_directory: .
          engine_version_number: ${{ github.ref_name }}
          settings_file_path: engine/settings/base.py

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.arch }} image
        uses: docker/build-push-action@v6
        with:
          context: engine/
          platforms: linux/${{ matrix.arch }}
          target: prod
          push: true
          tags: ${{ env.IMAGE }}:${{ github.ref_name }}-${{ matrix.arch }}

  publish:
    name: Publish multi-arch manifest
    needs: build
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push manifest
        run: |
          docker buildx imagetools create \
            --tag ${{ env.IMAGE }}:${{ github.ref_name }} \
            --tag ${{ env.IMAGE }}:latest \
            ${{ env.IMAGE }}:${{ github.ref_name }}-amd64 \
            ${{ env.IMAGE }}:${{ github.ref_name }}-arm64
