name: Publish release

on:
  push:
    tags:
      - v*

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  CHART: ghcr.io/appwrite/helm-charts/oncall
  IMAGE: ghcr.io/appwrite/grafana-oncall

jobs:
  verify:
    name: Verify release tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag and release commit
        env:
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must be a semantic version prefixed with v: $RELEASE_TAG"
            exit 1
          fi

          git fetch origin main
          if ! git merge-base --is-ancestor "$RELEASE_SHA" origin/main; then
            echo "Release commit $RELEASE_SHA is not part of origin/main"
            exit 1
          fi

  build:
    name: Build engine (${{ matrix.arch }})
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set engine version number in settings file
        uses: ./.github/actions/set-engine-version-in-settings
        with:
          working_directory: .
          engine_version_number: ${{ github.ref_name }}
          settings_file_path: engine/settings/base.py

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push staged image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: engine/
          platforms: linux/${{ matrix.arch }}
          target: prod
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ env.IMAGE }}:staging-${{ github.run_id }}-${{ matrix.arch }}

  plugin:
    name: Package Grafana plugin
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Check out project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install frontend dependencies
        uses: ./.github/actions/install-frontend-dependencies
        with:
          cache-dependencies: "false"

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: grafana-plugin/go.mod
          cache-dependency-path: grafana-plugin/go.sum
          cache: false

      - name: Install Mage
        run: go install github.com/magefile/mage@v1.15.0

      - name: Build and package plugin
        working-directory: grafana-plugin
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          version="${TAG#v}"
          jq --arg v "$version" '.version=$v' package.json > package.tmp
          mv package.tmp package.json

          pnpm build
          mage -v build:linux build:linuxARM64

          test -f dist/gpx_grafana_oncall_app_linux_amd64
          test -f dist/gpx_grafana_oncall_app_linux_arm64

          # Grafana expects the archive directory to use the plugin ID. The plugin is unsigned,
          # so deployments must allow-list it with GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS.
          mv dist grafana-oncall-app
          zip -qr "grafana-oncall-app-${version}.zip" ./grafana-oncall-app
          sha256sum "grafana-oncall-app-${version}.zip" > "grafana-oncall-app-${version}.zip.sha256"

      - name: Generate plugin SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: grafana-plugin/grafana-oncall-app
          format: spdx-json
          output-file: grafana-plugin/plugin-sbom.spdx.json
          upload-artifact: false

      - name: Attest plugin provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: grafana-plugin/grafana-oncall-app-*.zip

      - name: Attest plugin SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: grafana-plugin/grafana-oncall-app-*.zip
          sbom-path: grafana-plugin/plugin-sbom.spdx.json

      - name: Stage plugin release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: plugin-release-assets
          path: |
            grafana-plugin/grafana-oncall-app-*.zip
            grafana-plugin/grafana-oncall-app-*.zip.sha256
            grafana-plugin/plugin-sbom.spdx.json
          if-no-files-found: error
          retention-days: 7

  chart:
    name: Package Helm chart
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Check out project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Package Helm chart
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          helm lint ./helm/oncall
          helm package ./helm/oncall \
            --version "$version" \
            --app-version "$RELEASE_TAG" \
            --destination chart-assets

      - name: Attest Helm chart provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: chart-assets/oncall-*.tgz

      - name: Stage Helm chart release asset
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: helm-chart-release-assets
          path: chart-assets/oncall-*.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish atomic release
    needs:
      - build
      - chart
      - plugin
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: write
      id-token: write
      packages: write
    steps:
      - name: Download plugin release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: plugin-release-assets
          path: release-assets

      - name: Download Helm chart release asset
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: helm-chart-release-assets
          path: release-assets

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create staged multi-architecture image
        env:
          STAGING_TAG: staging-${{ github.run_id }}
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag "$IMAGE:$STAGING_TAG" \
            "$IMAGE:$STAGING_TAG-amd64" \
            "$IMAGE:$STAGING_TAG-arm64"

      - name: Resolve image digest
        id: image
        env:
          STAGING_TAG: staging-${{ github.run_id }}
        run: |
          set -euo pipefail
          digest=$(
            docker buildx imagetools inspect "$IMAGE:$STAGING_TAG" \
              --format '{{json .Manifest.Digest}}' | tr -d '"'
          )
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Could not resolve the published image digest: $digest"
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Generate engine SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ env.IMAGE }}:staging-${{ github.run_id }}-amd64
          format: spdx-json
          output-file: release-assets/engine-amd64-sbom.spdx.json
          upload-artifact: false

      - name: Generate ARM64 engine SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ env.IMAGE }}:staging-${{ github.run_id }}-arm64
          format: spdx-json
          output-file: release-assets/engine-arm64-sbom.spdx.json
          upload-artifact: false

      - name: Attest engine provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Install Crane
        uses: imjasonh/setup-crane@feee3b6bb0d4c68370f256a4502498c9227e5c6b # v0.7
        with:
          version: v0.22.0

      - name: Sign engine image
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$IMAGE_DIGEST"

      - name: Create release manifest
        working-directory: release-assets
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          plugin_archive=$(find . -maxdepth 1 -name 'grafana-oncall-app-*.zip' -print -quit)
          plugin_archive="${plugin_archive#./}"
          plugin_digest=$(sha256sum "$plugin_archive" | cut -d ' ' -f 1)
          chart_archive=$(find . -maxdepth 1 -name 'oncall-*.tgz' -print -quit)
          chart_archive="${chart_archive#./}"
          chart_digest=$(sha256sum "$chart_archive" | cut -d ' ' -f 1)
          chart_version="${RELEASE_TAG#v}"

          jq -n \
            --arg version "$RELEASE_TAG" \
            --arg engine_image "$IMAGE" \
            --arg engine_digest "$IMAGE_DIGEST" \
            --arg plugin_archive "$plugin_archive" \
            --arg plugin_digest "sha256:$plugin_digest" \
            --arg chart_archive "$chart_archive" \
            --arg chart_digest "sha256:$chart_digest" \
            --arg chart_reference "$CHART:$chart_version" \
            '{
              schemaVersion: 1,
              version: $version,
              engine: {
                image: $engine_image,
                digest: $engine_digest,
                reference: ($engine_image + "@" + $engine_digest)
              },
              plugin: {
                archive: $plugin_archive,
                digest: $plugin_digest
              },
              chart: {
                archive: $chart_archive,
                digest: $chart_digest,
                reference: $chart_reference
              }
            }' > release-manifest.json

      - name: Create release checksums
        working-directory: release-assets
        run: >-
          sha256sum grafana-oncall-app-*.zip oncall-*.tgz plugin-sbom.spdx.json
          engine-*-sbom.spdx.json release-manifest.json > SHA256SUMS

      - name: Create draft release and upload assets
        id: draft
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            is_draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)
            if [[ "$is_draft" != "true" ]]; then
              repair_dir=$(mktemp -d)
              gh release download "$RELEASE_TAG" \
                --pattern release-manifest.json \
                --dir "$repair_dir"
              published_digest=$(jq -r '.engine.digest' "$repair_dir/release-manifest.json")
              if [[ ! "$published_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
                echo "Published release has an invalid engine digest"
                exit 1
              fi
              echo "already_published=true" >> "$GITHUB_OUTPUT"
              echo "image_digest=$published_digest" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          else
            gh release create "$RELEASE_TAG" --draft --generate-notes --title "$RELEASE_TAG"
          fi

          gh release upload "$RELEASE_TAG" release-assets/* --clobber
          echo "already_published=false" >> "$GITHUB_OUTPUT"
          echo "image_digest=$IMAGE_DIGEST" >> "$GITHUB_OUTPUT"

      - name: Commit matched release
        id: release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ALREADY_PUBLISHED: ${{ steps.draft.outputs.already_published }}
          IMAGE_DIGEST: ${{ steps.draft.outputs.image_digest }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          published="$ALREADY_PUBLISHED"
          alias_created=false

          remove_unpublished_alias() {
            if [[ "$alias_created" != "true" || "$published" == "true" ]]; then
              return
            fi

            removed=false
            for attempt in 1 2 3 4 5; do
              if crane delete "$IMAGE:$RELEASE_TAG" && \
                ! crane digest "$IMAGE:$RELEASE_TAG" >/dev/null 2>&1; then
                removed=true
                break
              fi
              sleep $((attempt * 2))
            done
            if [[ "$removed" != "true" ]]; then
              echo "Failed to remove incomplete alias $IMAGE:$RELEASE_TAG"
              return 1
            fi
          }
          trap 'exit 130' INT TERM
          trap remove_unpublished_alias EXIT

          alias_verified=false
          if [[ "$ALREADY_PUBLISHED" != "true" ]]; then
            alias_created=true
          fi
          for attempt in 1 2 3 4 5; do
            if docker buildx imagetools create \
              --tag "$IMAGE:$RELEASE_TAG" \
              "$IMAGE@$IMAGE_DIGEST"; then
              if alias_digest=$(
                docker buildx imagetools inspect "$IMAGE:$RELEASE_TAG" \
                  --format '{{json .Manifest.Digest}}' | tr -d '"'
              ) && [[ "$alias_digest" == "$IMAGE_DIGEST" ]]; then
                alias_verified=true
                break
              fi
            fi
            sleep $((attempt * 2))
          done

          if [[ "$alias_verified" != "true" ]]; then
            echo "Version alias does not point to $IMAGE_DIGEST"
            exit 1
          fi

          # Publishing the matched GitHub release is the availability boundary.
          # A version alias created before this point is not a stable release.
          if [[ "$ALREADY_PUBLISHED" != "true" ]]; then
            gh release edit "$RELEASE_TAG" --draft=false --latest
            published=true
          fi

  publish-chart:
    name: Publish Helm chart as OCI artifact
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    steps:
      - name: Download Helm chart release asset
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: helm-chart-release-assets
          path: chart-assets

      - name: Restore authoritative chart from published release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          gh release download "$RELEASE_TAG" \
            --pattern "oncall-$version.tgz" \
            --dir chart-assets \
            --clobber
          gh release download "$RELEASE_TAG" \
            --pattern release-manifest.json \
            --dir chart-assets \
            --clobber

          expected_digest=$(jq -r '.chart.digest' chart-assets/release-manifest.json)
          actual_digest="sha256:$(sha256sum "chart-assets/oncall-$version.tgz" | cut -d ' ' -f 1)"
          if [[ "$actual_digest" != "$expected_digest" ]]; then
            echo "Chart digest $actual_digest does not match release manifest $expected_digest"
            exit 1
          fi

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Install Crane
        uses: imjasonh/setup-crane@feee3b6bb0d4c68370f256a4502498c9227e5c6b # v0.7
        with:
          version: v0.22.0

      - name: Log in OCI clients to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Push and verify Helm chart
        id: chart
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          archive="chart-assets/oncall-$version.tgz"
          test -f "$archive"

          pushed=false
          for attempt in 1 2 3; do
            if push_output=$(helm push "$archive" oci://ghcr.io/appwrite/helm-charts); then
              echo "$push_output"
              pushed=true
              break
            fi
            sleep $((attempt * 2))
          done
          if [[ "$pushed" != "true" ]]; then
            echo "Could not push the Helm chart"
            exit 1
          fi

          pushed_digest=$(sed -n 's/^Digest: //p' <<< "$push_output" | tail -1)
          registry_digest=$(crane digest "$CHART:$version")
          if [[ ! "$pushed_digest" =~ ^sha256:[0-9a-f]{64}$ || \
            "$registry_digest" != "$pushed_digest" ]]; then
            echo "Helm reported $pushed_digest but GHCR resolved $registry_digest"
            exit 1
          fi
          echo "digest=$registry_digest" >> "$GITHUB_OUTPUT"

      - name: Attest Helm chart provenance in GHCR
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.CHART }}
          subject-digest: ${{ steps.chart.outputs.digest }}
          push-to-registry: true

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign Helm chart
        env:
          CHART_DIGEST: ${{ steps.chart.outputs.digest }}
        run: cosign sign --yes "$CHART@$CHART_DIGEST"
