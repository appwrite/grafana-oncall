name: Publish engine Docker image

on:
  push:
    tags:
      - v*

jobs:
  publish:
    name: Build and publish to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set engine version number in settings file
        uses: ./.github/actions/set-engine-version-in-settings
        with:
          working_directory: .
          engine_version_number: ${{ github.ref_name }}
          settings_file_path: engine/settings/base.py

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: engine/
          platforms: linux/amd64,linux/arm64
          target: prod
          push: true
          tags: |
            ghcr.io/appwrite/grafana-oncall:${{ github.ref_name }}
            ghcr.io/appwrite/grafana-oncall:latest
