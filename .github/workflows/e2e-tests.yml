name: e2e tests

on:
  workflow_call:
    inputs:
      grafana_version:
        required: true
        type: string
      browsers:
        required: true
        type: string

jobs:
  end-to-end-tests:
    runs-on: ubuntu-latest
    name: "Grafana: ${{ inputs.grafana_version }}"
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Collect Workflow Telemetry
        uses: catchpoint/workflow-telemetry-action@94c3c3d9567a0205de6da68a76c428ce4e769af1 # v2.0.0
        with:
          comment_on_pr: false
          proc_trace_chart_show: false
          proc_trace_table_show: false

      - name: Install Kind
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          config: ./dev/kind.yml
          install_only: true

      - name: Install frontend dependencies
        uses: ./.github/actions/install-frontend-dependencies

      - name: Install Tilt
        run: |
          curl -fsSL https://raw.githubusercontent.com/tilt-dev/tilt/master/scripts/install.sh | bash

      - name: Install ctlptl
        run: |
          CTLPTL_VERSION="0.8.20"
          CTLPTL_FILE_NAME="ctlptl.$CTLPTL_VERSION.linux.x86_64.tar.gz"
          curl -fsSL https://github.com/tilt-dev/ctlptl/releases/download/v$CTLPTL_VERSION/$CTLPTL_FILE_NAME | \
            tar -xzv -C /usr/local/bin ctlptl

      - name: Use cached plugin frontend build
        id: cache-plugin-frontend
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: grafana-plugin/dist
          key: >-
            ${{ runner.os }}-plugin-frontend-${{
              hashFiles(
                'grafana-plugin/src/**',
                'grafana-plugin/public/**',
                'grafana-plugin/package.json',
                'grafana-plugin/pnpm-lock.yaml',
                'grafana-plugin/rsbuild.config.ts',
                'grafana-plugin/tsconfig.json'
              )
            }}

      - name: Build plugin frontend
        if: steps.cache-plugin-frontend.outputs.cache-hit != 'true'
        working-directory: grafana-plugin
        run: pnpm build

      # helpful reference for properly caching the playwright binaries/dependencies
      # https://playwrightsolutions.com/playwright-github-action-to-cache-the-browser-binaries/
      - name: Get installed Playwright version
        id: playwright-version
        working-directory: grafana-plugin
        run: >
          echo "PLAYWRIGHT_VERSION=$(cat ./package.json |
          jq -r '.devDependencies["@playwright/test"]')" >> $GITHUB_ENV

      - name: Cache Playwright binaries/dependencies
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: "~/.cache/ms-playwright"
          key: ${{ runner.os }}-playwright-${{ env.PLAYWRIGHT_VERSION }}-${{ inputs.browsers }}

      - name: Create cluster
        run: make cluster/up

      - name: Install Playwright deps
        shell: bash
        working-directory: grafana-plugin
        env:
          BROWSERS: ${{ inputs.browsers }}
        run: |
          IFS=',' read -ra browsers <<< "$BROWSERS"
          pnpm playwright install "${browsers[@]}"

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: grafana-plugin/go.mod
          cache-dependency-path: grafana-plugin/go.sum

      - name: Install Mage
        run: go install github.com/magefile/mage@v1.15.0

      - name: Tilt CI - standard E2E tests
        shell: bash
        env:
          GRAFANA_VERSION: ${{ inputs.grafana_version }}
          BROWSERS: ${{ inputs.browsers }}
        run: tilt ci

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-${{ inputs.grafana_version }}
          path: ./grafana-plugin/playwright-report/
          if-no-files-found: ignore
