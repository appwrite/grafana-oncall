repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.4
    hooks:
      # Each directory carries its own config: engine/pyproject.toml, tools/migrators/ruff.toml,
      # dev/scripts/ruff.toml. Ruff discovers the nearest one per file.
      - id: ruff-check
        args: [--fix]
        files: ^(engine|tools/migrators|dev/scripts)/
      - id: ruff-format
        files: ^(engine|tools/migrators|dev/scripts)/

  - repo: local
    hooks:
      - id: oxlint
        name: oxlint
        entry: >-
          bash -c "cd grafana-plugin && ./node_modules/.bin/oxlint --fix --max-warnings=20
          ${@/grafana-plugin\//}" --
        language: system
        types: [file]
        files: ^grafana-plugin/(src|e2e-tests)/(?:(?!autogenerated).)*\.(js|jsx|ts|tsx)$
      - id: oxfmt
        name: oxfmt
        entry: bash -c "cd grafana-plugin && ./node_modules/.bin/oxfmt --write ${@/grafana-plugin\//}" --
        language: system
        types: [file]
        files: ^grafana-plugin/.*\.(css|js|json|jsonc|jsx|scss|ts|tsx)$

  - repo: https://github.com/thibaudcolas/pre-commit-stylelint
    rev: v17.14.1
    hooks:
      - id: stylelint
        entry: bash -c "cd grafana-plugin && stylelint --fix ${@/grafana-plugin\//}" --
        types: [file]
        files: ^grafana-plugin/src/.*\.css$
        additional_dependencies:
          - stylelint@17.14.1
          - stylelint-config-standard@40.0.0

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.32.2
    hooks:
      - id: markdownlint
        name: markdownlint
        entry: >
          markdownlint --fix --ignore grafana-plugin/node_modules --ignore grafana-plugin/dist --ignore docs **/*.md
      - id: markdownlint
        name: markdownlint - docs/sources
        entry: markdownlint --fix --ignore README.md -c ./docs/.markdownlint.json ./docs/sources/**/*.md

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.32.0
    hooks:
      - id: yamllint
        name: yamllint
        entry: yamllint -c .yamllint.yml
        types: [yaml]
        args: [--no-warnings]
