repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.4
    hooks:
      # Each directory carries its own config: engine/pyproject.toml, tools/migrators/ruff.toml,
      # dev/scripts/ruff.toml. Ruff discovers the nearest one per file.
      - id: ruff-check
        args: [--fix]
        files: ^(engine|tools/migrators|dev/scripts)/
      - id: ruff-format
        files: ^(engine|tools/migrators|dev/scripts)/

  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v8.25.0
    hooks:
      - id: eslint
        entry: bash -c "cd grafana-plugin && eslint --max-warnings=20 --fix ${@/grafana-plugin\//}" --
        types: [file]
        files: ^grafana-plugin/src/(?:(?!autogenerated).)*\.(js|jsx|ts|tsx)$
        additional_dependencies:
          - eslint@^8.25.0
          - eslint-plugin-import@^2.25.4
          - eslint-plugin-rulesdir@^0.2.1
          - eslint-plugin-unused-imports@^3.1.0
          - "@grafana/eslint-config@^5.0.0"
          - eslint-plugin-promise@^6.1.1

  # - repo: https://github.com/pre-commit/mirrors-prettier
  #   rev: "v2.7.1"
  #   hooks:
  #     - id: prettier
  #       name: prettier
  #       types_or: [css, javascript, jsx, ts, tsx]
  #       files: ^grafana-plugin/src
  #       additional_dependencies:
  #         - prettier@2.8.2
  #     - id: prettier
  #       name: prettier - json
  #       types_or: [json]
  #       additional_dependencies:
  #         - prettier@2.8.2

  - repo: https://github.com/thibaudcolas/pre-commit-stylelint
    rev: v13.13.1
    hooks:
      - id: stylelint
        entry: bash -c "cd grafana-plugin && stylelint --fix ${@/grafana-plugin\//}" --
        types: [file]
        files: ^grafana-plugin/src/.*\.css$
        additional_dependencies:
          - stylelint@^13.13.1
          - stylelint-prettier@^2.0.0
          - stylelint-config-standard@^22.0.0
          - stylelint-config-prettier@^9.0.3

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.32.2
    hooks:
      - id: markdownlint
        name: markdownlint
        entry: >
          markdownlint --fix --ignore grafana-plugin/node_modules --ignore grafana-plugin/dist --ignore docs **/*.md
      - id: markdownlint
        name: markdownlint - docs/sources
        entry: markdownlint --fix --ignore README.md -c ./docs/.markdownlint.json ./docs/sources/**/*.md

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.32.0
    hooks:
      - id: yamllint
        name: yamllint
        entry: yamllint -c .yamllint.yml
        types: [yaml]
        args: [--no-warnings]
